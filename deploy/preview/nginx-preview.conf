# Reverse proxy for the PM planner preview API.
#
# A copy of ../nginx/raaspal-api.conf with three changes — server_name, the
# proxy_pass port, and the log paths — kept otherwise identical so the two
# files stay diffable.
#
# Install with:
#   sudo cp deploy/preview/nginx-preview.conf /etc/nginx/sites-available/raaspal-api-preview
#   sudo ln -s /etc/nginx/sites-available/raaspal-api-preview /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pm-preview-api.raaspal.com
#
# Do NOT add auth_basic here. It 401s the CORS preflight OPTIONS request and
# breaks the browser client in a way that looks like a backend bug. The app
# already gates /api/v1/pm/* behind ADMIN/RAASPAL_TEAM. If you want more, use
# `allow <office-ip>; deny all;` inside the location block.

server {
    listen 80;
    listen [::]:80;
    server_name pm-preview-api.raaspal.com;

    client_max_body_size 25M;
    client_body_timeout 120s;

    access_log /var/log/nginx/raaspal-api-preview.access.log;
    error_log  /var/log/nginx/raaspal-api-preview.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }
}
