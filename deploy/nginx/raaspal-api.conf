# Reverse proxy for the RaasPal API.
#
# Install with:
#   sudo cp deploy/nginx/raaspal-api.conf /etc/nginx/sites-available/raaspal-api
#   sudo ln -s /etc/nginx/sites-available/raaspal-api /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites this file when you run it, adding the TLS block and a
# redirect from 80 to 443. Do not hand-write those — let certbot do it.

server {
    listen 80;
    listen [::]:80;
    server_name api.raaspal.com;

    # Survey uploads are Excel, PDF and images. Nginx defaults to 1 MB, which
    # rejects them with a 413 before the request ever reaches the JVM.
    client_max_body_size 25M;

    # Requests carrying a file are slow to arrive over a Thai office connection.
    client_body_timeout 120s;

    access_log /var/log/nginx/raaspal-api.access.log;
    error_log  /var/log/nginx/raaspal-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app believes every request arrived over plain HTTP,
        # because nginx terminates TLS and talks to it in the clear.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proposal generation and requirement extraction call Anthropic and can
        # run past a minute. Nginx's 60s default would return 504 while the JVM
        # was still working.
        proxy_connect_timeout 15s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Report downloads stream; buffering them costs memory and delays the
        # first byte for no benefit.
        proxy_buffering off;
    }
}
