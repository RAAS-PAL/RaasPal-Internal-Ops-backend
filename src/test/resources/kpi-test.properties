# Board mapping for the KPI tests. The test profile's application.properties
# shadows the main one, so the boards are declared again here. ASCII only:
# @TestPropertySource does not default to UTF-8.
#
# Windows match the RE team's formulas: 14-day repeat, 30-day install follow-up,
# 7-day SLA measured from open date to RE Action date.
app.kpi.monday.repeat-window-days=14
app.kpi.monday.install-follow-up-days=30
app.kpi.monday.sync-zone=Asia/Bangkok

app.kpi.monday.boards[0].id=3451717331
