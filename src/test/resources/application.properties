# Test configuration — uses H2 in-memory database, no Flyway, no real PostgreSQL needed.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# JWT secret must be >= 32 characters for HS256
app.jwt.secret=test-secret-key-minimum-32-characters-long!!
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Partner bearer tokens are signed with a DIFFERENT key to the staff tokens
# above, so the two families cannot be interchanged. PartnerApiSecurityTest
# asserts exactly that, in both directions.
app.partner.jwt.secret=partner-test-secret-minimum-32-characters-long!!
# Matches the production default, so PartnerOAuthTest pins the lifetime partners
# are actually given rather than a value that only exists in tests.
app.partner.jwt.expiration-ms=86400000

# The token endpoint's per-IP budget is effectively disabled for the functional
# tests. They all exchange tokens from the same (absent) client address, so a
# production-sized budget would make an unrelated test fail with 429 as soon as
# enough token tests existed — a confusing failure with nothing to do with the
# behaviour under test. PartnerTokenThrottleTest pins a small budget in its own
# context and asserts the throttle there instead.
app.partner.token-rate-limit-per-minute=10000

app.file.upload-dir=uploads/test
app.ai.provider=mock
app.cors.allowed-origins=http://localhost:3000

# Mail — host set so MailSenderAutoConfiguration provides a JavaMailSender bean
# for the context to load. Nothing is actually sent during tests.
spring.mail.host=localhost
app.mail.from=RAASPAL Reports <no-reply@raaspal.com>
app.public.base-url=http://localhost:3000
app.public.report-locale=th

# --- Daily Pending Case Report ---
# Needed here as well as in the main file: this properties file shadows
# src/main/resources/application.properties rather than merging with it, so a key
# absent here is absent full stop, and an @Value with no default fails the whole
# Spring context. Adding a required app.* key means adding it in both places.
#
# Deliberately the real six greater-Bangkok provinces rather than a fixture value:
# a context test that boots with nonsense here would pass while production had the
# list wrong. SlaCalculatorTest passes its own list explicitly and does not read this.
# The Thai names are \u-escaped for the reason given in the main file.
app.casereport.metro-provinces=Bangkok,Nonthaburi,Pathum Thani,Samut Prakan,Samut Sakhon,Nakhon Pathom,\
\u0E01\u0E23\u0E38\u0E07\u0E40\u0E17\u0E1E,\u0E01\u0E23\u0E38\u0E07\u0E40\u0E17\u0E1E\u0E21\u0E2B\u0E32\u0E19\u0E04\u0E23,\u0E01\u0E17\u0E21,\u0E19\u0E19\u0E17\u0E1A\u0E38\u0E23\u0E35,\u0E1B\u0E17\u0E38\u0E21\u0E18\u0E32\u0E19\u0E35,\u0E2A\u0E21\u0E38\u0E17\u0E23\u0E1B\u0E23\u0E32\u0E01\u0E32\u0E23,\u0E2A\u0E21\u0E38\u0E17\u0E23\u0E2A\u0E32\u0E04\u0E23,\u0E19\u0E04\u0E23\u0E1B\u0E10\u0E21

# The scheduler must not fire during tests.
app.casereport.sync-enabled=false
