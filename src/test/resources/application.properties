# Test configuration — uses H2 in-memory database, no Flyway, no real PostgreSQL needed.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# JWT secret must be >= 32 characters for HS256
app.jwt.secret=test-secret-key-minimum-32-characters-long!!
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

app.file.upload-dir=uploads/test
app.ai.provider=mock
