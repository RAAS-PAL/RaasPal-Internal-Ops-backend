spring.application.name=robot-recommendation-api

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/robot_recommendation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-to-a-real-secret-min-32-characters!!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.raaspal=DEBUG
logging.level.org.springframework.security=INFO