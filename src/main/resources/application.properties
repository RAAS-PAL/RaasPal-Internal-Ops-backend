spring.application.name=robot-recommendation-api

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/robot_recommendation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP connection pool ────────────────────────────────────────────────
# Supabase session-mode pooler caps at 15 connections per project.
# Keep the pool small so Flyway + app startup never exceeds that limit.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.file.upload-dir=${FILE_UPLOAD_DIR:uploads/customer-surveys}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.ai.provider=${AI_PROVIDER:mock}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
app.anthropic.proposal-model=${ANTHROPIC_PROPOSAL_MODEL:claude-opus-4-8}

# ─── JWT ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:change-this-to-a-real-secret-min-32-characters!!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── CVTE C3 status (Kava Open Gateway API) ────────────────────────────────
app.cvte.kava.base-url=${CVTE_KAVA_BASE_URL:}
app.cvte.kava.app-id=${CVTE_KAVA_APP_ID:}
app.cvte.kava.app-secret=${CVTE_KAVA_APP_SECRET:}
app.cvte.kava.sign-type=${CVTE_KAVA_SIGN_TYPE:hmac}
app.cvte.kava.polling-enabled=${CVTE_KAVA_POLLING_ENABLED:false}
app.cvte.kava.polling-interval-ms=${CVTE_KAVA_POLLING_INTERVAL_MS:60000}

# ─── Telemetry: Gausium Open API ───────────────────────────────────────────
app.gausium.api.base-url=${GAUSIUM_API_BASE_URL:https://openapi.gs-robot.com}
app.gausium.api.client-id=${GAUSIUM_API_CLIENT_ID:}
app.gausium.api.client-secret=${GAUSIUM_API_CLIENT_SECRET:}
app.gausium.api.open-access-key=${GAUSIUM_API_OPEN_ACCESS_KEY:}

# ─── Telemetry: Monthly report delivery (Supabase Storage + n8n + LINE) ─────
# All blank by default; isConfigured() guards keep delivery inert until wired.
# Scheduler is off unless REPORTS_SCHEDULER_ENABLED=true; cron defaults to
# 06:00 on the 1st of each month (sends the previous month's reports).
app.reports.scheduler-enabled=${REPORTS_SCHEDULER_ENABLED:false}
app.reports.scheduler-cron=${REPORTS_SCHEDULER_CRON:0 0 6 1 * *}
# Weekly cadence — independent toggle; cron defaults to 06:00 every Monday
# (sends the previous full ISO week's reports).
app.reports.weekly-scheduler-enabled=${REPORTS_WEEKLY_SCHEDULER_ENABLED:false}
app.reports.weekly-scheduler-cron=${REPORTS_WEEKLY_SCHEDULER_CRON:0 0 6 * * MON}
app.reports.n8n.webhook-url=${REPORTS_N8N_WEBHOOK_URL:}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:monthly-reports}
app.supabase.signed-url-expiry-seconds=${SUPABASE_SIGNED_URL_EXPIRY_SECONDS:2592000}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.raaspal=DEBUG
logging.level.org.springframework.security=INFO
