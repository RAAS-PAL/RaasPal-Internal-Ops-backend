spring.application.name=raaspal-ops-backend

# The PM planner's company filter travels in the query string; nginx's request-line
# buffer is 8 KB and Tomcat's default header limit was the same, so a long-but-legal
# filter could be refused by either. The console now sends the shorter of the two
# lists, which keeps a real request under ~4 KB; this is the margin behind it.
server.max-http-request-header-size=16KB

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/robot_recommendation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP connection pool ────────────────────────────────────────────────
# Supabase session-mode pooler caps at 15 connections per project, so stay under
# it. 10 gives real concurrency headroom for report-view bursts while leaving
# room for Flyway/startup. If you need more concurrency than this, switch the
# datasource to Supabase's TRANSACTION-mode pooler (port 6543), which allows far
# more short-lived connections, and this cap can then grow.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# The database is in another region (Supabase, ap-southeast-2) while the API runs in
# Singapore, so every statement costs roughly 100ms in latency alone. Without batching,
# a telemetry sync writes one row per round trip: a robot with 500 task reports spends
# a minute doing nothing but waiting. Batched, that is a handful of round trips.
# UUID ids (not IDENTITY) are what make this possible at all.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Last resort against a query that never returns. Hikari's connection-timeout covers
# getting a connection, not running a statement, so a stuck query had nothing to stop
# it -- a fleet sync sat on one for half an hour. Seconds; generous enough for a slow
# report query, short enough that a hung run fails and moves on.
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:300}

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.file.upload-dir=${FILE_UPLOAD_DIR:uploads/customer-surveys}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.ai.provider=${AI_PROVIDER:mock}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
app.anthropic.proposal-model=${ANTHROPIC_PROPOSAL_MODEL:claude-opus-4-8}
# Output ceiling per call. Was hard-coded at 4096, which a three-option recommendation
# or a full proposal can exceed -- and a response cut off there reached the parser as
# malformed JSON, reported as "unreadable response". Raised, and truncation is now
# detected via stop_reason and reported as what it is.
app.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:16000}
# A request with no timeout waits forever on a silent server; generous, because a long
# proposal legitimately takes minutes.
app.anthropic.connect-timeout-seconds=${ANTHROPIC_CONNECT_TIMEOUT_SECONDS:15}
app.anthropic.read-timeout-seconds=${ANTHROPIC_READ_TIMEOUT_SECONDS:300}

# ─── JWT ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.jwt.secret=${JWT_SECRET:change-this-to-a-real-secret-min-32-characters!!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── CVTE C3 status (Kava Open Gateway API) ────────────────────────────────
app.cvte.kava.base-url=${CVTE_KAVA_BASE_URL:}
app.cvte.kava.app-id=${CVTE_KAVA_APP_ID:}
app.cvte.kava.app-secret=${CVTE_KAVA_APP_SECRET:}
app.cvte.kava.sign-type=${CVTE_KAVA_SIGN_TYPE:hmac}
app.cvte.kava.polling-enabled=${CVTE_KAVA_POLLING_ENABLED:false}
app.cvte.kava.polling-interval-ms=${CVTE_KAVA_POLLING_INTERVAL_MS:60000}

# ─── Telemetry: Gausium Open API ───────────────────────────────────────────
app.gausium.api.base-url=${GAUSIUM_API_BASE_URL:https://openapi.gs-robot.com}
app.gausium.api.client-id=${GAUSIUM_API_CLIENT_ID:}
app.gausium.api.client-secret=${GAUSIUM_API_CLIENT_SECRET:}
app.gausium.api.open-access-key=${GAUSIUM_API_OPEN_ACCESS_KEY:}
# A stalled Gausium response used to park the whole single-threaded fleet sync.
app.gausium.api.connect-timeout-seconds=${GAUSIUM_API_CONNECT_TIMEOUT_SECONDS:15}
app.gausium.api.read-timeout-seconds=${GAUSIUM_API_READ_TIMEOUT_SECONDS:90}

# ─── Partner API OAuth (client credentials) ─────────────────────────────────
# Partners exchange client_id + client_secret at /api/partner/v1/oauth/token for
# a short-lived bearer, then send that on data requests.
#
# This secret MUST differ from app.jwt.secret. The staff JwtUtils issues tokens
# with no audience or type claim, so sharing a key would make a partner token
# structurally acceptable to the staff filter. Separate keys make the two token
# families cryptographically incompatible — the signature itself is the boundary.
app.partner.jwt.secret=${PARTNER_JWT_SECRET:partner-dev-secret-change-me-minimum-32-characters!!}
# Startup fails if the placeholder secrets above are still in use, unless this is
# explicitly set (application-local.properties does). See PartnerSecretStartupCheck.
app.security.allow-placeholder-secrets=${ALLOW_PLACEHOLDER_SECRETS:false}
# 24 hours. Longer than a typical bearer because the data is read-only cleaning
# history, and because revocation does not depend on expiry here: PartnerJwtAuthFilter
# re-checks the credential on every request, so a revoked or expired credential kills
# its live tokens immediately rather than when they lapse.
app.partner.jwt.expiration-ms=${PARTNER_JWT_EXPIRATION_MS:86400000}

# ─── Partner API hardening (/api/partner/v1) ────────────────────────────────
# Rate limit: fixed window per API key, counted in-memory (Caffeine), so no
# shared store is needed. NOTE the budget is per application instance — with more
# than one instance the effective limit multiplies. 120/min is generous for a
# partner looping over a fleet, but stops a tight polling loop.
app.partner.rate-limit-enabled=${PARTNER_RATE_LIMIT_ENABLED:true}
app.partner.rate-limit-per-minute=${PARTNER_RATE_LIMIT_PER_MINUTE:120}
# The token endpoint is permitAll, so it is metered per client IP instead of per
# credential. A client caching its token for the full hour needs one exchange an
# hour, so this only ever bites an unauthenticated loop.
app.partner.token-rate-limit-per-minute=${PARTNER_TOKEN_RATE_LIMIT_PER_MINUTE:20}
# Access audit: one row per partner request (including rejected ones) in
# partner_api_access_logs. Volume is small (a partner pulls periodically), and an
# audit write can never fail a response. Retention is enforced by the cleanup below.
app.partner.audit-enabled=${PARTNER_AUDIT_ENABLED:true}
app.partner.audit-retention-days=${PARTNER_AUDIT_RETENTION_DAYS:90}
app.partner.audit-cleanup-cron=${PARTNER_AUDIT_CLEANUP_CRON:0 30 3 * * *}

# ─── Telemetry sync scheduler (keeps robot_task_reports current) ────────────
# Disabled by default — enable in production once brand API credentials are set.
# Pulls every actively deployed robot's task reports so the report pages and the
# partner API serve fresh data. Defaults to midnight daily (in the zone below).
# The look-back window re-checks the last N days each run to pick up tasks that
# arrive late or were missed while a robot was offline; re-syncing is safe
# because reports are deduplicated on external task id. That window is also what
# covers a task still running at midnight: it completes after the run, and the
# next night's run picks it up.
app.telemetry.sync-enabled=${TELEMETRY_SYNC_ENABLED:false}
app.telemetry.sync-cron=${TELEMETRY_SYNC_CRON:0 0 0 * * *}
app.telemetry.sync-zone=${TELEMETRY_SYNC_ZONE:Asia/Bangkok}
app.telemetry.sync-lookback-days=${TELEMETRY_SYNC_LOOKBACK_DAYS:3}

# ─── Telemetry: AutoXing Cloud Platform API (on-demand delivery report) ──────
# Region: global = https://apiglobal.autoxing.com, China = https://api.autoxing.com
app.autoxing.api.base-url=${AUTOXING_API_BASE_URL:https://apiglobal.autoxing.com}
app.autoxing.api.app-id=${AUTOXING_API_APP_ID:}
app.autoxing.api.app-secret=${AUTOXING_API_APP_SECRET:}
app.autoxing.api.app-code=${AUTOXING_API_APP_CODE:}
# AutoXing's gateway (Alibaba Cloud API Gateway) requires the AppCode header as
# "APPCODE <code>" — confirmed against the live global endpoint. Default true;
# set false only if a future gateway wants the raw code.
app.autoxing.api.appcode-scheme=${AUTOXING_API_APPCODE_SCHEME:true}

# ─── Email (SMTP) ───────────────────────────────────────────────────────────
# For local testing use Gmail SMTP with an App Password (not your login password):
#   MAIL_USERNAME=you@gmail.com  MAIL_PASSWORD=<16-char app password>
# Sending stays inert (errors clearly) until username/password are set.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:RAASPAL Reports <no-reply@raaspal.com>}
# Standing CC on monthly performance report emails — the RAASPAL team addresses that
# should keep a copy of everything sent to customers. Comma or semicolon separated;
# empty (the default) means no CC.
# Applies ONLY to the report emails. Announcements carry their own per-send CC box,
# and quietly adding a standing CC there would surprise whoever writes a one-off message.
app.mail.cc=${MAIL_CC:}
# Base URL of the frontend (where /[locale]/report/{token} lives) used in email links.
app.public.base-url=${PUBLIC_BASE_URL:http://localhost:3000}
app.public.report-locale=${PUBLIC_REPORT_LOCALE:th}

# ─── Automated report delivery scheduler ───────────────────────────────────
# Disabled by default — enable in production once SMTP credentials are set.
# Fires on the 2nd of each month at 08:00 (in the zone below) and sends the
# PREVIOUS month's report (waiting one day past month-end so telemetry is synced).
app.reports.email-scheduler-enabled=${REPORT_EMAIL_SCHEDULER_ENABLED:false}
app.reports.email-scheduler-cron=${REPORT_EMAIL_SCHEDULER_CRON:0 0 8 2 * *}
app.reports.email-scheduler-zone=${REPORT_EMAIL_SCHEDULER_ZONE:Asia/Bangkok}

# ── Ops alerts to the customer success team ──
# Two morning nudges: contracts ending within the window (each deployment alerted once,
# re-armed when its end date changes), and on one day a month the list of robots that
# logged nothing last month. Off unless enabled AND a recipient is set.
app.alerts.enabled=${OPS_ALERTS_ENABLED:false}
app.alerts.cs-email=${OPS_ALERTS_CS_EMAIL:}
app.alerts.cron=${OPS_ALERTS_CRON:0 0 8 * * *}
app.alerts.zone=${OPS_ALERTS_ZONE:Asia/Bangkok}
# 90 days: a quarter for the CS team to call, quote and get the renewal signed.
app.alerts.contract-window-days=${OPS_ALERTS_CONTRACT_WINDOW_DAYS:90}
# The nightly sync looks back 3 days, so last month has settled by the 3rd.
app.alerts.zero-data-day-of-month=${OPS_ALERTS_ZERO_DATA_DAY:3}

# ─── Report cache (Caffeine, in-memory) ─────────────────────────────────────
# Computed monthly reports are cached to absorb view bursts and spare DB
# connections. TTL is a staleness safety net; the cache is also evicted whenever
# telemetry is synced, so fresh data appears immediately after a sync.
app.cache.report.ttl-minutes=${REPORT_CACHE_TTL_MINUTES:30}
app.cache.report.max-size=${REPORT_CACHE_MAX_SIZE:2000}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.raaspal=DEBUG
logging.level.org.springframework.security=INFO


# --- monday.com API ---
app.monday.api.base-url=${MONDAY_API_BASE_URL:https://api.monday.com/v2}
app.monday.api.token=${MONDAY_API_TOKEN:}
app.monday.api.version=${MONDAY_API_VERSION:2026-07}
# Items per items_page call. monday allows up to 500, but every column of every
# item counts against the per-minute complexity budget, so 100 keeps a 40-column
# ticket board comfortably inside it while halving the calls of the old 50.
app.monday.api.page-size=${MONDAY_PAGE_SIZE:100}
# Runaway-cursor guard, per group. Must exceed the largest archive group divided by
# page-size: the Delivery board's "DONE-Ticket" group is over 2,500 rows, and the
# old cap of 50 pages x 50 rows silently cut it off. When the cap is hit the read
# is flagged incomplete and the sync does NOT mark unseen rows absent.
app.monday.api.max-pages-per-group=${MONDAY_MAX_PAGES_PER_GROUP:500}
# Comments fetched per item. 50 rather than 10 since the Solution column is written from
# the whole thread: a case open 52 days can carry twenty updates, and a line built from
# the last ten would start mid-story. monday caps this at 100. The KPI sync only needs
# "current status", which 50 also covers, so the larger value is safe for both callers.
app.monday.api.updates-per-item=${MONDAY_UPDATES_PER_ITEM:50}
# Without these the JDK HTTP client waits on the socket forever: one unanswered
# request parks the sync thread permanently, and since scheduled and manual runs
# share a lock, every later run is refused until the process restarts. A timeout
# instead fails one board, with the reason on its run row.
app.monday.api.connect-timeout-seconds=${MONDAY_CONNECT_TIMEOUT_SECONDS:15}
app.monday.api.read-timeout-seconds=${MONDAY_READ_TIMEOUT_SECONDS:90}

# --- RE KPI: monday.com ticket sync ---
# Mirrors the Installation, Cleaning and Delivery ticket boards into case_ticket so
# the RE KPI dashboard computes 1st Time Install, First Time Fix and SLA from real
# tickets instead of a hand-built deck. Needs app.monday.api.token above.
#
# Disabled by default, like the telemetry sync: deploying this must not start
# calling monday on its own. POST /api/v1/kpi/monday/sync runs it on demand either
# way. 01:30 Bangkok is after the working day and before anyone opens the console.
app.kpi.monday.sync-enabled=${KPI_MONDAY_SYNC_ENABLED:false}
app.kpi.monday.sync-cron=${KPI_MONDAY_SYNC_CRON:0 30 1 * * *}
app.kpi.monday.sync-zone=${KPI_MONDAY_SYNC_ZONE:Asia/Bangkok}
#
# The two windows the KPIs turn on. RE team's figures, 2026-09-08.
# First Time Fix:    a CM followed by another CM on the same serial within 14 days
#                    scores 0.
# 1st Time Install:  an installation followed by a CM on the same serial within 30
#                    days of the TimeLine ending scores 0.
app.kpi.monday.repeat-window-days=${KPI_REPEAT_WINDOW_DAYS:14}
app.kpi.monday.install-follow-up-days=${KPI_INSTALL_FOLLOW_UP_DAYS:30}
#
# One block per board. Column ids are board-specific and collide across boards with
# different meanings (`text` is Main Issue on Cleaning but Solution on Delivery), so
# the mapping lives here per board, never in code. Every column is still captured
# verbatim into case_ticket.raw_columns, so a mapping corrected later applies on the
# next sync without re-reading history.
#
# Confirm ids with GET /api/v1/kpi/monday/boards/{boardId} (schema only, no rows),
# and find a board id with GET /api/v1/kpi/monday/boards. Override via env, e.g.
#   APP_KPI_MONDAY_BOARDS_0_COLUMNS_ACTIONDATE=date_1
# Unmapped fields stay null. group-ids empty = read every group on the board
# (closed tickets move between groups, and the KPI needs all of them).
#
# sla-days: the case must be CHECKED within this many days of being reported —
# 3, confirmed by the RE team 2026-09-09. Applies to CM boards only; SLA is not
# measured for installations.
# the board's RE Action date minus its Open Date. 7 for both ticket boards.
# Neither board has a close-date column, which is why SLA measures time to first
# action rather than time to close.
#
# Cleaning Tickets — every column id VERIFIED against the live board 2026-09-08.
app.kpi.monday.boards[0].id=3451717331
app.kpi.monday.boards[0].service-line=CLEANING
app.kpi.monday.boards[0].ticket-type=CM
app.kpi.monday.boards[0].sla-days=3
app.kpi.monday.boards[0].columns.ticket-no=item_id
app.kpi.monday.boards[0].columns.open-date=date8
app.kpi.monday.boards[0].columns.action-date=date_1
app.kpi.monday.boards[0].columns.status=status
app.kpi.monday.boards[0].columns.sup-status=status7
app.kpi.monday.boards[0].columns.issue-level=status_1
app.kpi.monday.boards[0].columns.main-issue=text
app.kpi.monday.boards[0].columns.branch=text6
app.kpi.monday.boards[0].columns.project=asset_owner3__1
app.kpi.monday.boards[0].columns.serial=text0
app.kpi.monday.boards[0].columns.robot-model=status_17
# "Type of case" is mapped for the record but NOTHING is excluded. A filter that
# drops the parts-shipping rows (รับอะไหล่ / ส่งอะไหล่) reproduces the deck's H1-2026
# cleaning total (639 vs 643) - but only by coincidence: it removes 84 tickets from
# Feb-Mar that the deck's own monthly labels keep (unfiltered Jan/Feb/Mar/Jun match
# the deck to within two tickets), and a May surplus happens to cancel that. The
# monthly evidence wins. The remaining gap is May itself (deck 38, live 133) and is
# a question for the RE team, not a filter.
app.kpi.monday.boards[0].columns.category=color_mkyj4ncq
app.kpi.monday.boards[0].include-categories=
#
# Delivery Tickets — every column id VERIFIED against the live board 2026-09-08.
# Three ids were wrong before that check: serial is tags42 (was asset_owner, which
# is Project), project is asset_owner (was tags2), branch-code is tags2 (was
# tags42). The serial error was the damaging one — First Time Fix would have
# matched tickets on project name, making unrelated cases look like repeats.
app.kpi.monday.boards[1].id=1647612496
app.kpi.monday.boards[1].service-line=DELIVERY
app.kpi.monday.boards[1].ticket-type=CM
app.kpi.monday.boards[1].sla-days=3
app.kpi.monday.boards[1].columns.ticket-no=item_id
app.kpi.monday.boards[1].columns.open-date=date5
app.kpi.monday.boards[1].columns.action-date=date_18
app.kpi.monday.boards[1].columns.status=status
app.kpi.monday.boards[1].columns.sup-status=status_1
app.kpi.monday.boards[1].columns.issue-level=status_136
app.kpi.monday.boards[1].columns.main-issue=main_issue_key_word3
app.kpi.monday.boards[1].columns.branch=text6
app.kpi.monday.boards[1].columns.branch-code=tags2
app.kpi.monday.boards[1].columns.project=asset_owner
app.kpi.monday.boards[1].columns.serial=tags42
app.kpi.monday.boards[1].columns.robot-model=status_139
app.kpi.monday.boards[1].columns.province=color_mm6mwh74
# "Type of Case", mapped for the record; nothing excluded - the deck's delivery
# total (815) equals every row on the board (816).
app.kpi.monday.boards[1].columns.category=color_mkyh88bs
app.kpi.monday.boards[1].include-categories=
#
# Installation Tickets — every column id VERIFIED against the live board 2026-09-08.
#
# This board states neither service line nor a column holding one: its nearest,
# "Robot  Models" (status_1), names models rather than families. So installations
# are classified by SERIAL — the same robot's S/N appears on the Cleaning or
# Delivery board, and those are single-line, so they identify it. The serial is
# effectively a foreign key across the three boards. An installation whose serial
# has never been serviced stays unclassified: it counts in the fleet total and in
# neither column, and the API reports how many, rather than guessing a side.
#
# install-date is the TimeLine column; its LATER date is used, because the 30-day
# first-time-install window starts when the installation finished.
#
# No open-date and no RE Action column exist here, so installations carry no SLA
# of their own — SLA is a CM measure, and the board has nothing to measure it from.
app.kpi.monday.boards[2].id=3109668017
app.kpi.monday.boards[2].ticket-type=INSTALLATION
app.kpi.monday.boards[2].sla-days=3
app.kpi.monday.boards[2].columns.ticket-no=item_id
app.kpi.monday.boards[2].columns.install-date=timeline
app.kpi.monday.boards[2].columns.serial=text33
app.kpi.monday.boards[2].columns.status=status_1__1
app.kpi.monday.boards[2].columns.robot-model=status_1
# This board is really the RE team's JOB board: "Job Type" has 25 labels - Survey
# Site, Demo, Training, Transport, Bring, MA, Meeting, QC, Unbox, EVENT, Support
# case ... - and "Installation" is one of them. Only the install-shaped ones count.
# ⚠️ PROVISIONAL: for Jan-Jun 2026 this list still yields 59 rows (Plans 26, Mapping
# & Training 24, Installation 6, DONE 2, Install mapping 1) against the deck's 23,
# and no subset of labels gives 23. Which of these the RE team counts as an
# installation is an open question; until answered, the excluded labels are the
# ones that are plainly not installations.
app.kpi.monday.boards[2].columns.category=status
app.kpi.monday.boards[2].include-categories=Installation,Install mapping,Mapping & Training,Mapping,Plans,DONE

# --- RE KPI: CSAT survey workbooks ---
# CSAT is the one RE KPI with no monday source. It comes from the post-job phone
# survey, which the RE team tallies by hand into four workbooks — one per survey:
# installation, MA (= PM), CM cleaning, CM delivery — and replaces once a month.
# This points at the folder they land in. The workbooks are parsed on request and
# re-read when a file changes, so a replaced workbook shows on the next page load;
# nothing is persisted and nothing is scheduled. Only the month sheets are read,
# by label, never the per-case sheets that name customers.
#
# Two places the workbooks can be: a bucket, or a folder on this machine. The
# bucket wins wherever one is configured, and is the deployed console's source —
# Render's disk is wiped on every deploy and the RE team cannot write to it.
# The folder is how a developer works on CSAT without credentials; blank and with
# no bucket either, GET /api/v1/kpi/csat is a 400 naming these settings.
# The workbooks are uploaded in the console, on the CSAT page, and stored in
# kpi_csat_workbook. Uploading replaces the current workbook for that survey and
# keeps the one before it as history, so "who changed June's number" has an
# answer. Nothing is scheduled: a replaced workbook shows on the next page load.
#
# This replaced an S3 bucket - nine settings and a key pair to hold four small
# files that change monthly. The bytes now live in the database, which is a
# separate host with its own backups, rather than on the uploads volume, which
# only a manual Lightsail snapshot captures. The workbook is the audit trail for
# a figure on a board deck, so it is restored together with that figure.
#
# The folder below is a local escape hatch: set it and the backend reads that
# folder instead of the uploads, which is how you work on the parser against a
# pile of files without uploading them one at a time. Every deployment leaves it
# blank. With no folder set and nothing uploaded, GET /api/v1/kpi/csat is a 400
# saying to upload the workbooks.
app.kpi.csat.folder=${KPI_CSAT_FOLDER:}
app.kpi.csat.zone=${KPI_CSAT_ZONE:Asia/Bangkok}

# --- Daily Pending Case Report ---
# Daily snapshot of both monday boards.
#
# Off by default, like the report email scheduler: the sync is idempotent within a
# day, but two instances writing the same snapshot is noise nobody needs to debug.
#
# WARNING: every day this stays off is a day of history that cannot be recovered.
# monday cannot be asked what a ticket looked like last Tuesday, so the delivery
# report Solution column -- which is built from consecutive snapshots -- stays empty
# until this has been running. POST /api/v1/case-reports/sync runs it by hand.
app.casereport.sync-enabled=${CASE_REPORT_SYNC_ENABLED:false}
# 06:15 Bangkok, before the team starts editing the boards.
app.casereport.sync-cron=${CASE_REPORT_SYNC_CRON:0 15 6 * * *}

# Provinces on the shorter SLA (3 days rather than 5). Greater Bangkok.
# Listed in both scripts on purpose: the "Location raaspal robot" board writes
# them in Thai ("สาขา พระราม3 กรุงเทพ"), while staff typing into the console are
# likely to use English. Matching is case-insensitive after trimming.
#
# Verified against the board on 2026-09-10: the delivery board's Province column
# (color_mm6mwh74) is a dropdown with 14 labels, and the six greater-Bangkok ones
# are spelled in Latin while all eight upcountry ones are in Thai. That is the
# habit of whoever built the dropdown, not a rule, which is why both scripts are
# listed — a later กรุงเทพมหานคร must not fall through to the 5-day threshold and
# read as on time for two extra days.
# Cleaning reports are 3 days everywhere and never consult this list at all.
#
# The Thai names are \u-escaped because Spring Boot reads .properties files as
# ISO-8859-1: typed directly, each loads as a run of Latin-1 characters that no
# board value can equal. MetroProvincesPropertyTest fails if raw Thai comes back.
# In order they are: กรุงเทพ, กรุงเทพมหานคร, กทม, นนทบุรี, ปทุมธานี, สมุทรปราการ,
# สมุทรสาคร, นครปฐม
app.casereport.metro-provinces=${CASE_REPORT_METRO_PROVINCES:\
Bangkok,Nonthaburi,Pathum Thani,Samut Prakan,Samut Sakhon,Nakhon Pathom,\
\u0E01\u0E23\u0E38\u0E07\u0E40\u0E17\u0E1E,\u0E01\u0E23\u0E38\u0E07\u0E40\u0E17\u0E1E\u0E21\u0E2B\u0E32\u0E19\u0E04\u0E23,\u0E01\u0E17\u0E21,\u0E19\u0E19\u0E17\u0E1A\u0E38\u0E23\u0E35,\u0E1B\u0E17\u0E38\u0E21\u0E18\u0E32\u0E19\u0E35,\u0E2A\u0E21\u0E38\u0E17\u0E23\u0E1B\u0E23\u0E32\u0E01\u0E32\u0E23,\u0E2A\u0E21\u0E38\u0E17\u0E23\u0E2A\u0E32\u0E04\u0E23,\u0E19\u0E04\u0E23\u0E1B\u0E10\u0E21}

# How many Solution-cell model calls run at once while a pending-case sheet is
# generated. One per ticket; in series a large sheet took minutes. Bounded for the
# API's rate limits and the box's two cores.
app.casereport.solution-concurrency=${CASE_REPORT_SOLUTION_CONCURRENCY:6}

# --- Contract documents (Tools -> Contracts) ---
# The signed contract PDFs, in a private S3 bucket. Leave the bucket blank and the
# feature answers "not configured" instead of failing to start. The IAM user behind
# the key reaches this one bucket only (policy raaspal-contracts-bucket-access).
app.contracts.s3.bucket=${CONTRACT_S3_BUCKET:}
app.contracts.s3.region=${CONTRACT_S3_REGION:ap-southeast-1}
app.contracts.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.contracts.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# --- Per-brand service-ticket analytics (console: /tickets?brand=...) ---
# A brand is recognised on the delivery board by its model labels OR by a fragment
# of the item name: AutoXing robots are labelled Zara / Zara L300 / Zara Bot L600 /
# D150, and the tickets where the label was left as Bella or Pudu still start with
# "ZARA" or "D150". Label indexes are read live from the board at sync time.
# Synced right after the daily board snapshot, and on demand from the console.
# monday-web-url is the account origin for per-ticket deep links; blank hides them.
app.tickets.monday-web-url=${TICKETS_MONDAY_WEB_URL:}
